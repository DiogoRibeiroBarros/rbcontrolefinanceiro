<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel RB Gestão</title><link rel="stylesheet" href="/portal/admin.css"></head><body><main><header class="top"><div><span class="eyebrow">RB GESTÃO FINANCEIRA</span><h1>Painel administrativo</h1><p>Clientes, assinaturas e dispositivos em um só lugar.</p></div><button id="logout" class="secondary" hidden>Sair</button></header><p id="message" role="status"></p><section id="login" class="panel login-panel"><h2>Acesso administrativo</h2><p>Use as credenciais administrativas configuradas no servidor.</p><form id="login-form"><label>E-mail administrativo<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Entrar no painel</button></form></section><section id="dashboard" hidden><div id="metrics" class="metrics"></div><section class="panel"><div class="section-head"><div><span class="eyebrow">CLIENTES</span><h2>Gerenciar clientes</h2></div><button id="new-customer" class="primary">Cadastrar cliente</button></div><div class="toolbar"><input id="search" placeholder="Buscar por nome ou e-mail"><select id="status-filter"><option value="">Todos os status</option><option value="active">Ativos</option><option value="blocked">Bloqueados</option></select><button id="reload" class="secondary">Atualizar</button></div><div id="customers" class="table-wrap"></div></section><section class="panel"><div class="section-head"><div><span class="eyebrow">CADASTRO</span><h2>Novo cliente</h2></div><button id="close-form" class="secondary" hidden>Fechar</button></div><form id="customer-form" hidden><input type="hidden" name="id"><div class="form-grid"><label>Nome<input name="name" required maxlength="100"></label><label>E-mail<input name="email" type="email" required maxlength="254"></label><label>Senha inicial<input name="password" type="password" minlength="8" maxlength="128" required></label><label>Plano<select name="plan"><option>FREE</option><option>PRO</option><option>BUSINESS</option></select></label><label>Status<select name="status"><option value="active">Ativo</option><option value="blocked">Bloqueado</option></select></label></div><button class="primary">Salvar cliente</button></form></section></section></main><script src="/portal/admin.js"></script></body></html>
