<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RB Gestão · Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main><header><div><span>RB GESTÃO FINANCEIRA</span><h1>Painel administrativo</h1><p>Clientes, licenças e dispositivos em tempo real.</p></div><button id="logout" hidden>Sair</button></header><div id="message" role="status" aria-live="polite"></div><section id="login" class="card"><h2>Acesso seguro</h2><p>Entre com a credencial administrativa do servidor de licenças.</p><form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Entrar</button></form></section><section id="app" hidden><div id="metrics" class="metrics"></div><div class="card"><div class="head"><div><span>CLIENTES</span><h2>Contas cadastradas</h2></div><button id="new" class="primary" type="button">Cadastrar cliente</button></div><div class="tools"><input id="search" placeholder="Buscar nome ou e-mail" aria-label="Buscar cliente"><select id="filter" aria-label="Filtrar clientes"><option value="">Todos</option><option value="active">Ativos</option><option value="blocked">Bloqueados</option></select><button id="refresh" type="button">Atualizar</button></div><div id="customers"></div></div><dialog id="editor" aria-labelledby="editor-title"><div class="dialog-card"><div class="head"><h2 id="editor-title">Novo cliente</h2><button id="cancel" type="button">Fechar</button></div><form id="customer-form"><input type="hidden" name="id"><div class="grid"><label>Nome<input name="name" required maxlength="100" autocomplete="name"></label><label>E-mail<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Senha inicial<input name="password" type="password" minlength="8" autocomplete="new-password"><small>Obrigatória ao criar; opcional ao editar.</small></label><label>Plano<select name="plan"><option>FREE</option><option>PRO</option><option>BUSINESS</option></select></label></div><button class="primary" type="submit">Salvar cliente</button></form></div></dialog></section></main><script src="/admin/admin.js"></script></body></html>
