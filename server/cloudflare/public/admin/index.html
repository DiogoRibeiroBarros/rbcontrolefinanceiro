<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RB Gestão · Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main><header><div><span>RB GESTÃO FINANCEIRA</span><h1>Painel administrativo</h1><p>Clientes, licenças e dispositivos em tempo real.</p></div><button id="logout" hidden>Sair</button></header><div id="message"></div><section id="login" class="card"><h2>Acesso seguro</h2><p>Entre com a credencial administrativa do servidor de licenças.</p><form id="login-form"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button class="primary">Entrar</button></form></section><section id="app" hidden><div id="metrics" class="metrics"></div><div class="card"><div class="head"><div><span>CLIENTES</span><h2>Contas cadastradas</h2></div><button id="new" class="primary">Cadastrar cliente</button></div><div class="tools"><input id="search" placeholder="Buscar nome ou e-mail"><select id="filter"><option value="">Todos</option><option value="active">Ativos</option><option value="blocked">Bloqueados</option></select><button id="refresh">Atualizar</button></div><div id="customers"></div></div><div id="editor" class="card" hidden><div class="head"><h2 id="editor-title">Novo cliente</h2><button id="cancel">Fechar</button></div><form id="customer-form"><input type="hidden" name="id"><div class="grid"><label>Nome<input name="name" required maxlength="100"></label><label>E-mail<input name="email" type="email" required maxlength="254"></label><label>Senha inicial<input name="password" type="password" minlength="8" required></label><label>Plano<select name="plan"><option>FREE</option><option>PRO</option><option>BUSINESS</option></select></label></div><button class="primary">Salvar cliente</button></form></div></section></main><script src="/admin/admin.js"></script></body></html>
