name: Publicar APK móvel

on:
  push:
    tags:
      - 'vMB.*'

permissions:
  contents: write

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-rebuild/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        working-directory: mobile-rebuild
        run: npm ci

      - name: Validar aplicativo
        working-directory: mobile-rebuild
        run: npm test && npm run typecheck && npx expo-doctor

      - name: Gerar projeto Android
        working-directory: mobile-rebuild
        run: npx expo prebuild --platform android

      - name: Preparar assinatura permanente
        shell: bash
        env:
          RB_MOBILE_KEYSTORE_BASE64: ${{ secrets.RB_MOBILE_KEYSTORE_BASE64 }}
          RB_MOBILE_STORE_PASSWORD: ${{ secrets.RB_MOBILE_STORE_PASSWORD }}
          RB_MOBILE_KEY_ALIAS: ${{ secrets.RB_MOBILE_KEY_ALIAS }}
          RB_MOBILE_KEY_PASSWORD: ${{ secrets.RB_MOBILE_KEY_PASSWORD }}
        run: |
          test -n "$RB_MOBILE_KEYSTORE_BASE64" && test -n "$RB_MOBILE_STORE_PASSWORD" && test -n "$RB_MOBILE_KEY_ALIAS" && test -n "$RB_MOBILE_KEY_PASSWORD"
          echo "$RB_MOBILE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rb-mobile-release.jks"
          cd mobile-rebuild
          npm run android:configure-release

      - name: Compilar APK
        working-directory: mobile-rebuild/android
        env:
          ORG_GRADLE_PROJECT_RB_MOBILE_STORE_FILE: ${{ runner.temp }}/rb-mobile-release.jks
          ORG_GRADLE_PROJECT_RB_MOBILE_STORE_PASSWORD: ${{ secrets.RB_MOBILE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RB_MOBILE_KEY_ALIAS: ${{ secrets.RB_MOBILE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RB_MOBILE_KEY_PASSWORD: ${{ secrets.RB_MOBILE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Nomear APK da release
        run: mv mobile-rebuild/android/app/build/outputs/apk/release/app-release.apk "mobile-rebuild/android/app/build/outputs/apk/release/RB_Gestao_Financeira_Mobile_${GITHUB_REF_NAME}.apk"

      - name: Publicar release móvel
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          prerelease: true
          make_latest: false
          body: |
            Correção:
            ---
            - APK móvel gerado e validado automaticamente pelo workflow.

            Novo Recurso:
            ---
            - Atualização automática do aplicativo por releases `vMB.*`.

            Novo Modulo:
            ---
            - Cliente RB Gestão Financeira Mobile.
          files: mobile-rebuild/android/app/build/outputs/apk/release/RB_Gestao_Financeira_Mobile_${{ github.ref_name }}.apk
          name: RB Gestão Mobile ${{ github.ref_name }}
