name: Publicar instaladores

on:
  push:
    tags:
      - 'vDK.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar testes
        run: npm test
      - name: Gerar instaladores Full e Atualização
        run: |
          npm run build:installers
          Copy-Item release/latest.yml release/latest-full.yml -Force
          Copy-Item release/latest-full.yml release/latest.yml -Force
      - name: Criar release e anexar instaladores
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            release/release-*/*.exe
            release/latest.yml
