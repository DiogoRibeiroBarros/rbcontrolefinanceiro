<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RB Gestão Financeira</title>
  <meta name="theme-color" content="#0B0F14">
  <link rel="icon" href="assets/rb_gestao.ico">
  <link rel="manifest" href="app.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-heading">
        <button class="brand compact-brand" data-action="mobile-sidebar" type="button" aria-controls="sidebar" aria-expanded="false" title="Abrir menu">
          <div class="brand-logo-frame"><img src="assets/rb_gestao_horizontal_sidebar_hd.png" alt="RB Gestão Financeira" class="brand-horizontal-logo"></div>
          <img src="assets/rb_gestao.ico" alt="RB Gestão" class="brand-collapsed-icon">
        </button>
        <button class="sidebar-toggle" id="sidebar-toggle" data-action="toggle-sidebar" type="button" aria-controls="sidebar" aria-expanded="true" title="Recolher menu">
          <span class="sidebar-toggle-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="sr-only">Recolher menu</span>
        </button>
      </div>
      <button class="profile-switcher" id="profile-switcher" data-action="open-profiles" type="button" aria-label="Trocar perfil"></button>
      <label class="sidebar-search" for="nav-search">
        <span aria-hidden="true">⌕</span>
        <input id="nav-search" type="search" placeholder="Pesquisar módulo" autocomplete="off">
      </label>
      <div class="sidebar-navigation" aria-label="Módulos do aplicativo">
        <div class="nav-section-label">NAVEGAÇÃO</div>
        <nav id="nav"></nav>
      </div>
      <div class="sidebar-footer">
        <img src="assets/rb_gestao_horizontal.png" alt="RB Gestão" class="footer-logo">
        <strong class="app-version" id="app-version">Versão</strong>
        <small>Dados locais neste computador</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="screen-title">Início</h1>
          <p id="screen-subtitle">Controle financeiro pessoal</p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="prev-month" title="Mês anterior">‹</button>
          <button class="month-btn" id="month-label" title="Mês selecionado"></button>
          <button class="icon-btn" id="next-month" title="Próximo mês">›</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal-root"></div>
  <input id="import-file" class="hidden" type="file" accept="application/json,.json">
  <script src="remote-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
